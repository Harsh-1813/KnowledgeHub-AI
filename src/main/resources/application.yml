
spring:
  application:
    name: KnowledgeHub-AI

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:knowledgehub}
    username: ${POSTGRES_USER:knowledgehub_user}
    password: ${POSTGRES_PASSWORD:local_dev_password_123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never
